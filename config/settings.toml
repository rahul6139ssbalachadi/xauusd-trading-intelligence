# Global safety switch (Section 23). Must be flipped explicitly and
# deliberately -- never implied by any other setting or code path.
# Flipped to true by the account owner's explicit instruction on
# 2026-09-22: "live_trading_enabled=true" (demo execution phase).
# The execution engine additionally hard-guards: DEMO accounts only.
live_trading_enabled = true

[paths]
data_raw = "data/raw"
data_processed = "data/processed"
data_cache = "data/cache"
db = "db/trading.db"

# Default historical window for bootstrap ingestion (Phase 1 scope).
# Individual ingestion calls may override this. Empty string = open end
# (present) -- TOML has no null, this is the documented convention.
[default_history]
start = "2018-01-01"
end = ""
