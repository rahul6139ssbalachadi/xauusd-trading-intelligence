# Canonical symbol registry. All internal code (providers, backtest,
# strategy) refers to symbols by the canonical name, e.g. symbols.EURUSD.
# Each provider translates canonical -> its own naming via the
# per-source key (dukascopy / histdata / xm) in that symbol's table.
#
# xm names follow the ".i" suffix pattern confirmed for GOLD.i (broker
# context: XM). Only GOLD.i itself has been confirmed -- other ".i"
# names below are an assumed pattern and MUST be verified against the
# manual XM export before being trusted (Section 31: flag conflicts,
# never assume).

# Full timeframe set supported by the system (Section 6).
timeframes = ["M1", "M5", "M15", "M30", "H1", "H4", "D1"]

# Timeframes actually being bootstrapped right now.
active_timeframes = ["H1", "M15"]

[symbols.EURUSD]
active = true
dukascopy = "EURUSD"
histdata = "EURUSD"
xm = "EURUSD.i"  # assumed pattern, unconfirmed

[symbols.XAUUSD]
active = true
dukascopy = "XAUUSD"
histdata = "XAUUSD"
xm = "GOLD.i#"  # confirmed via symbols_get() 2026-08-16

# Registered per Section 5 but not part of the Phase 1 bootstrap.
# No source names set -- do not guess vendor-specific naming ahead of
# need.
[symbols.GBPUSD]
active = false

[symbols.USDJPY]
active = false

[symbols.NAS100]
active = false

[symbols.US30]
active = false

[symbols.BTCUSD]
active = true
dukascopy = "BTCUSD"
histdata = "BTCUSD"
# Confirmed against the live terminal 2026-09-28 via symbols_get():
#   'BTCUSD#'  digits=2  point=0.01  visible=True  trade_mode=4 (full)
# Also present and visible: BTCEUR#, BTCGBP# (BTCJPY# exists but NOT visible).
# Availability probed 2026-09-28 (hard ~100k bar cap per request):
#   M1  ~68d   M5  ~340d   M15 ~2y   M30 ~4y   H1 ~10y   H4 ~13y   D1 ~13y
xm = "BTCUSD#"
