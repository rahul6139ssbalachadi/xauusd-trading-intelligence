<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading — Live Status</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#21262d; --txt:#e6edf3;
    --dim:#8b949e; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
    --buy:#3fb950; --sell:#f85149; --wait:#8b949e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:14px 16px;border-bottom:1px solid var(--line);
         display:flex;justify-content:space-between;align-items:center;gap:12px;
         position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:600}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  .badge{font-size:11px;padding:3px 8px;border-radius:10px;font-weight:600;
         text-transform:uppercase;letter-spacing:.4px}
  .b-ok{background:rgba(63,185,80,.15);color:var(--ok)}
  .b-warn{background:rgba(210,153,34,.15);color:var(--warn)}
  .b-bad{background:rgba(248,81,73,.15);color:var(--bad)}
  .b-dim{background:rgba(139,148,158,.15);color:var(--dim)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
        padding:14px;margin-bottom:14px}
  .card h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;
           letter-spacing:.6px;color:var(--dim);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .stat{background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:10px}
  .stat .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
  .stat .v{font-size:17px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:8px;border-bottom:1px solid var(--line);
     color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
  td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .dir{font-weight:700;font-size:12px;padding:2px 7px;border-radius:4px}
  .d-BUY{color:var(--buy);background:rgba(63,185,80,.12)}
  .d-SELL{color:var(--sell);background:rgba(248,81,73,.12)}
  .d-WAIT{color:var(--wait);background:rgba(139,148,158,.12)}
  .d-BLOCKED{color:var(--warn);background:rgba(210,153,34,.12)}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .reason{color:var(--dim);font-size:12px;margin-top:4px;max-width:520px}
  .empty{color:var(--dim);font-style:italic;padding:8px 0}
  .bar{height:4px;background:#21262d;border-radius:2px;overflow:hidden;margin-top:5px;min-width:60px}
  .bar>i{display:block;height:100%;background:var(--ok)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .note{background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.3);
        border-radius:6px;padding:10px;font-size:12px;color:var(--warn);margin-bottom:14px}
</style>
</head>
<body>
<header>
  <h1>Trading — Live Status</h1>
  <div id="badges" style="display:flex;gap:6px;flex-wrap:wrap"></div>
</header>
<div class="wrap">
  <div id="staleBanner"></div>
  <div class="card">
    <h2>MT5 Connection</h2>
    <div class="grid" id="healthGrid"><div class="empty">Loading…</div></div>
  </div>
  <div class="card">
    <h2>Open Positions</h2>
    <div id="positions"><div class="empty">Loading…</div></div>
  </div>
  <div class="card">
    <h2>Latest Signals</h2>
    <div id="signals"><div class="empty">Loading…</div></div>
  </div>
  <div class="card">
    <h2>Approved Strategies</h2>
    <div id="approved"><div class="empty">Loading…</div></div>
  </div>
</div>
<script>
const API = (location.port ? location.origin : location.origin);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n2 = v => (v === null || v === undefined || Number.isNaN(v)) ? "—" : Number(v).toFixed(2);

function badge(text, cls){
  return `<span class="badge ${cls}">${esc(text)}</span>`;
}

function renderHealth(h){
  $("badges").innerHTML =
    (h.connected ? badge("MT5 connected","b-ok") : badge("MT5 offline","b-bad")) +
    (h.stale ? badge("stale data","b-warn") : badge("fresh","b-ok")) +
    badge("demo only","b-dim");

  $("staleBanner").innerHTML = h.stale
    ? `<div class="note"><b>Data is stale.</b> ${esc(h.detail || "")}
       The read service has not completed a recent cycle, so any signal
       below was computed from old bars. Do not act on it.</div>` : "";

  const age = h.stale_seconds;
  const ageTxt = age === null || age === undefined ? "—"
    : age < 90 ? `${Math.round(age)}s ago`
    : age < 5400 ? `${Math.round(age/60)}m ago`
    : `${(age/3600).toFixed(1)}h ago`;

  const cells = [
    ["Login", h.login ?? "—"],
    ["Server", h.server || "—"],
    ["Balance", h.balance ? "$"+n2(h.balance) : "—"],
    ["Equity", h.equity ? "$"+n2(h.equity) : "—"],
    ["Free margin", h.margin_free ? "$"+n2(h.margin_free) : "—"],
    ["Last cycle", ageTxt],
    ["Cycles", h.cycles ?? "—"],
    ["Errors", h.errors ?? "—"],
  ];
  $("healthGrid").innerHTML = cells.map(([k,v]) =>
    `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`
  ).join("");

  if (h.last_error) {
    $("healthGrid").innerHTML +=
      `<div class="stat" style="grid-column:1/-1">
         <div class="k">Last error</div>
         <div class="v mono" style="font-size:12px;color:var(--bad)">${esc(h.last_error)}</div>
       </div>`;
  }
}

function renderPositions(rows, h){
  const n = rows && rows[0] ? rows[0].open_positions : null;
  if (n === null || n === undefined){
    $("positions").innerHTML = '<div class="empty">Position count unknown — read service offline.</div>';
    return;
  }
  $("positions").innerHTML = n === 0
    ? '<div class="empty">No open positions.</div>'
    : `<table><thead><tr><th>Count</th><th>As of</th></tr></thead>
       <tbody><tr><td class="num">${n}</td><td class="mono">${esc(rows[0].as_of || "—")}</td></tr></tbody></table>`;
}

function renderSignals(rows){
  if (!rows || !rows.length){
    $("signals").innerHTML =
      '<div class="empty">No signals recorded yet. Signals appear once a strategy runner completes a cycle.</div>';
    return;
  }
  $("signals").innerHTML = `<table>
    <thead><tr>
      <th>Strategy</th><th>Ver</th><th>Symbol</th><th>TF</th><th>Side</th>
      <th>Entry</th><th>SL</th><th>TP</th><th>R:R</th><th>Lots</th>
      <th>Risk $</th><th>Conf</th><th>Time</th>
    </tr></thead><tbody>` + rows.map(s => {
      const conf = s.confidence ?? 0;
      return `<tr>
        <td>${esc(s.strategy)}</td>
        <td class="mono">${esc(s.strategy_number)}</td>
        <td>${esc(s.symbol)}</td>
        <td>${esc(s.timeframe)}</td>
        <td><span class="dir d-${esc(s.direction)}">${esc(s.direction)}</span></td>
        <td class="num">${n2(s.entry)}</td>
        <td class="num">${n2(s.stop)}</td>
        <td class="num">${n2(s.target)}</td>
        <td class="num">${s.risk_reward ? Number(s.risk_reward).toFixed(2) : "—"}</td>
        <td class="num">${s.lots ? Number(s.lots).toFixed(2) : "—"}</td>
        <td class="num">${s.risk_usd ? "$"+n2(s.risk_usd) : "—"}</td>
        <td class="num">${Number(conf).toFixed(2)}
          <div class="bar"><i style="width:${Math.max(0,Math.min(1,conf))*100}%"></i></div>
        </td>
        <td class="mono">${esc((s.timestamp || "").replace("T"," ").slice(0,19))}</td>
      </tr>
      <tr><td colspan="13" style="border:0;padding:0 8px 10px">
        <div class="reason"><b>Reason:</b> ${esc(s.reason || "—")}
        ${s.invalidation ? `<br><b>Invalidation:</b> ${esc(s.invalidation)}` : ""}
        ${s.simulated ? `<br><span class="mono">simulated — not a broker order</span>` : ""}
        </div></td></tr>`;
    }).join("") + "</tbody></table>";
}

function renderApproved(rows){
  if (!rows || !rows.length){ $("approved").innerHTML = '<div class="empty">None.</div>'; return; }
  $("approved").innerHTML = `<table>
    <thead><tr><th>Strategy</th><th>Ver</th><th>Market</th><th>Risk</th>
    <th>Max spread</th><th>Approved</th><th>Magic</th></tr></thead><tbody>` +
    rows.map(a => `<tr>
      <td>${esc(a.name)}</td><td class="mono">${esc(a.version)}</td>
      <td>${esc(a.market)}</td>
      <td class="num">${a.risk_pct != null ? (a.risk_pct*100).toFixed(1)+"%" : "—"}</td>
      <td class="num">${a.max_spread_pips ?? "—"}</td>
      <td class="mono">${esc(a.approved_on || "—")}</td>
      <td class="mono">${a.magic ?? "—"}</td></tr>`).join("") +
    "</tbody></table>";
}

async function load(){
  try {
    const r = await fetch(`${API}/api/live`, {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    renderHealth(d.reader || {});
    renderPositions(d.positions, d.reader);
    renderSignals(d.signals);
    renderApproved(d.approved_strategies);
  } catch (e) {
    $("badges").innerHTML = badge("API unreachable","b-bad");
    $("staleBanner").innerHTML =
      `<div class="note">Cannot reach the API (${esc(e.message)}).
       Is the server running?</div>`;
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
