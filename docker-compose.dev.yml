# =============================================================================
# DEVELOPMENT compose — Phase 14
# =============================================================================
#   docker compose -f docker-compose.dev.yml up
#
# Differences from prod, all deliberate:
#   - API_PORT 8000 is published on 0.0.0.0 so a phone on the same LAN can
#     reach http://<your-lan-ip>:8000/m during development.
#   - ENVIRONMENT=development, so the API starts with a dev secret instead of
#     refusing to boot. Never do this on a server.
#   - Source is bind-mounted, so edits take effect without a rebuild.
#   - No log rotation tuning, no healthcheck start_period tuning.
#
# Local development without Docker is still fully supported and simpler:
#   .venv/Scripts/python.exe api/main.py
#   .venv/Scripts/python.exe worker.py
# =============================================================================

name: trading-ai-dev

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: trading-ai:dev
  volumes:
    # Source bind-mount for live edits. The DB stays in a named volume so a
    # rebuild does not lose it.
    - .:/app
    - db:/app/db
    - runtime:/app/run
    - logs:/app/logs
    # Hide the Windows venv from the Linux container, otherwise the bind
    # mount brings in Windows binaries and confuses the interpreter.
    - /app/.venv

services:
  api:
    <<: *common
    container_name: trading-api-dev
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      ENVIRONMENT: development
      API_SECRET_KEY: ${API_SECRET_KEY:-dev-secret-change-in-production}
      LOG_FORMAT: text
      LOG_FILE: ""
      EXECUTION_ADAPTER: ${EXECUTION_ADAPTER:-null}

  worker:
    <<: *common
    container_name: trading-worker-dev
    command: ["python", "worker.py"]
    environment:
      ENVIRONMENT: development
      LOG_FORMAT: text
      LOG_FILE: /app/logs/worker.log
      WORKER_TICK_SECONDS: "${WORKER_TICK_SECONDS:-300}"
    depends_on: [api]
    profiles: ["worker"]      # opt in with: --profile worker

volumes:
  db:
    name: trading-db-dev
  runtime:
    name: trading-runtime-dev
  logs:
    name: trading-logs-dev
