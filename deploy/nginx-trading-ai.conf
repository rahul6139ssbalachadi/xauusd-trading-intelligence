# =============================================================================
# Nginx reverse proxy for the Trading AI API + phone dashboard
# =============================================================================
# Install:
#   sudo cp deploy/nginx-trading-ai.conf /etc/nginx/sites-available/trading-ai
#   sudo ln -s /etc/nginx/sites-available/trading-ai /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file terminates TLS and forwards to the API container on 127.0.0.1:8000.
# The compose file already binds the API to localhost, so this proxy is the
# ONLY way in from outside the machine. That is the correct arrangement:
# one TLS termination point, one place where headers are set.
#
# ---------------------------------------------------------------------------
# VARIANT A — you have a domain and want HTTPS
# ---------------------------------------------------------------------------
# 1. Point the domain's A record at this server's public IP.
# 2. Install certbot and get a certificate:
#      sudo apt install certbot python3-certbot-nginx
#      sudo certbot --nginx -d your-domain.com
#    certbot rewrites this file and adds the HTTP->HTTPS redirect for you.
# 3. Leave `listen 80` in place for the ACME challenge.
#
# ---------------------------------------------------------------------------
# VARIANT B — you have no domain, only an IP
# ---------------------------------------------------------------------------
# Comment out the `listen 443 ssl` server block and the HTTP->HTTPS redirect,
# and use the plain-HTTP block at the bottom of this file. NOTE: HTTP is
# unencrypted. Your login password and JWT travel in clear text. That is
# acceptable on a trusted home LAN and NOT acceptable over the public
# internet. If you must expose this by IP to the internet, use a tunnel
# (Cloudflare Tunnel, Tailscale, or an SSH tunnel) instead of raw HTTP.
# =============================================================================

# Rate-limit zones. The API has its own in-process limiter, but this is at a
# different layer and costs nothing to have.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

upstream trading_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# --- HTTP: ACME challenge + redirect ----------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Leave this reachable over plain HTTP so certbot can validate.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    # certbot --nginx writes these two paths for you. If you are not using
    # certbot yet, either run it or comment the block out and use variant B.
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # The API serves its own dashboard, so no static root is needed.
    client_max_body_size 1m;

    location / {
        limit_req zone=api_limit burst=10 nodelay;
        limit_conn api_conn 20;

        proxy_pass         http://trading_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for the WebSocket status channel at /ws.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 75s;   # longer than the 15s /ws push interval
        proxy_send_timeout 75s;
    }

    # Health checks are frequent and cheap; do not rate-limit them, or a
    # monitoring loop can get itself locked out.
    location = /health {
        proxy_pass       http://trading_api;
        access_log       off;
    }
}

# =============================================================================
# VARIANT B — no domain, plain HTTP (LAN only)
# =============================================================================
# Use this INSTEAD of the two blocks above if you have no domain.
# WARNING: credentials and tokens cross this connection unencrypted.
# server {
#     listen 80;
#     server_name _;
#     client_max_body_size 1m;
#
#     location / {
